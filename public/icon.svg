<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="shieldBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a0808" />
      <stop offset="60%" stop-color="#140505" />
      <stop offset="100%" stop-color="#080202" />
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc" />
      <stop offset="30%" stop-color="#ffd700" />
      <stop offset="70%" stop-color="#e69500" />
      <stop offset="100%" stop-color="#995200" />
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a3e00" />
      <stop offset="40%" stop-color="#d48800" />
      <stop offset="80%" stop-color="#ffcc00" />
      <stop offset="100%" stop-color="#fff8e7" />
    </linearGradient>

    <!-- Fire Crimson Gradients -->
    <linearGradient id="fireRuby" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="50%" stop-color="#c41010" />
      <stop offset="100%" stop-color="#600202" />
    </linearGradient>

    <linearGradient id="wingFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#800000" />
      <stop offset="40%" stop-color="#e62e00" />
      <stop offset="80%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ffee55" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="epicGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur1" />
      <feFlood flood-color="#ff5500" flood-opacity="0.7" result="color" />
      <feComposite in="color" in2="blur1" operator="in" result="glow1" />
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Shield Container -->
  <path d="M 256 16 C 360 16 456 68 476 172 C 496 276 432 400 256 496 C 80 400 16 276 36 172 C 56 68 152 16 256 16 Z" 
        fill="url(#shieldBg)" stroke="url(#goldLight)" stroke-width="12" filter="drop-shadow(0px 16px 32px rgba(0,0,0,0.85))" />

  <path d="M 256 36 C 344 36 436 80 452 176 C 468 268 412 376 256 466 C 100 376 44 268 60 176 C 76 80 168 36 256 36 Z" 
        fill="none" stroke="#ff4400" stroke-width="3" opacity="0.6" />

  <!-- Ambient Glow Behind Wings -->
  <circle cx="256" cy="240" r="160" fill="#ff4400" opacity="0.25" filter="url(#coreGlow)" />

  <!-- Archangel Wings (Left Wing) -->
  <g id="leftWing">
    <!-- Top Feather -->
    <path d="M 240 210 C 200 140 120 70 48 96 C 24 106 50 148 90 170 C 130 192 190 224 236 230 Z" fill="url(#wingFlame)" />
    <!-- Mid Feather 1 -->
    <path d="M 240 236 C 180 180 90 140 36 176 C 20 188 44 220 84 236 C 134 256 194 260 238 252 Z" fill="url(#goldLight)" />
    <!-- Mid Feather 2 -->
    <path d="M 240 258 C 170 230 80 220 44 260 C 34 272 60 292 100 296 C 150 300 200 286 242 270 Z" fill="url(#wingFlame)" />
    <!-- Bottom Feather -->
    <path d="M 244 278 C 180 274 100 290 80 330 C 72 344 98 354 130 344 C 170 332 216 308 246 288 Z" fill="url(#goldDark)" />
  </g>

  <!-- Archangel Wings (Right Wing - Mirrored) -->
  <use href="#leftWing" transform="translate(512, 0) scale(-1, 1)" />

  <!-- Central Crest / Ruby Diamond Core -->
  <g filter="url(#epicGlow)">
    <!-- Golden Diamond Border -->
    <path d="M 256 86 L 366 226 L 256 366 L 146 226 Z" fill="url(#shieldBg)" stroke="url(#goldLight)" stroke-width="10" />
    <path d="M 256 108 L 344 226 L 256 344 L 168 226 Z" fill="url(#fireRuby)" />
  </g>

  <!-- Iconic Gothic MU "M" Crest -->
  <g filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.9))">
    <!-- Outer M Silhouette in Gold -->
    <path d="M 180 310 L 180 160 L 222 160 L 256 236 L 290 160 L 332 160 L 332 310 L 296 310 L 296 216 L 268 276 L 244 276 L 216 216 L 216 310 Z" 
          fill="url(#goldLight)" stroke="#552200" stroke-width="3" />

    <!-- Sharp Sword Blade Center Point -->
    <polygon points="256,60 268,140 256,160 244,140" fill="url(#goldLight)" stroke="#995200" stroke-width="2" />

    <!-- Gem highlights on M -->
    <polygon points="256,236 268,260 256,276 244,260" fill="#fff5cc" />
  </g>

  <!-- Bottom Crest Emblems -->
  <circle cx="256" cy="410" r="14" fill="url(#goldLight)" filter="url(#coreGlow)" />
  <circle cx="256" cy="410" r="7" fill="#ffffff" />
  <polygon points="256,430 264,446 256,456 248,446" fill="url(#goldLight)" />
</svg>
